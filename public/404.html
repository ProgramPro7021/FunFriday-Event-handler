<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script type="text/javascript">
      // Save the pathname for later use
      var redirect = window.location.pathname;
      if (redirect !== '/') {
        sessionStorage.redirect = redirect;
      }
      // Redirect to root
      window.location.href = '/';
    </script>
  </head>
  <body></body>
</html>
